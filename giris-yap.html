<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap — SeliGame</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/giris-yap.css">
</head>
</head>
<body>

<div class="grain"></div>

<div class="ambient">
  <div class="amb-grid"></div>
  <div class="amb-orb o1"></div>
  <div class="amb-orb o2"></div>
</div>

<nav class="top-nav">
  <a href="seligame.html" class="brand">
    <img src="logo.png" alt="SeliGame" class="brand-logo"
      onerror="this.style.display='none';this.nextElementSibling.style.display='inline-flex'">
    <span class="brand-fallback" style="display:none;align-items:center;gap:10px">
      <span class="brand-mark">S</span>
      <span>SeliGame</span>
    </span>
  </a>
  <a href="seligame.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    Ana Sayfa
  </a>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-eyebrow">// HESABA GİRİŞ</div>
    <h1 class="auth-title">Tekrar<br><span class="accent">hoş geldin.</span></h1>
    <p class="auth-sub">
      TikTok kullanıcı adın veya e-posta adresinle giriş yap. Yayını kaldığın yerden devam ettir.
    </p>

    <form class="form" id="loginForm" novalidate>
      <div class="field">
        <label class="field-label" for="login-email">E-posta</label>
        <input type="email" id="login-email" class="field-input" placeholder="mail@ornek.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label" for="login-password">Şifre</label>
        <input type="password" id="login-password" class="field-input" placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <div class="field-row">
        <label class="checkbox">
          <input type="checkbox" checked>
          <span class="checkbox-text">Beni hatırla</span>
        </label>
        <a href="#" class="forgot-link">Şifremi unuttum</a>
      </div>

      <div id="login-error" class="auth-error" style="display:none"></div>
      <button type="submit" id="login-submit" class="submit-btn">Giriş Yap</button>
    </form>

    <div class="auth-foot">
      Hesabın yok mu?<a href="uye-ol.html">Üye Ol</a>
    </div>
  </div>
</div>


<script src="js/api.js"></script>
<script src="js/giris-yap.js"></script>

</body>
</html>
